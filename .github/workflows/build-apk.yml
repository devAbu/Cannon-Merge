name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Balance sanity check
        run: node tools/sim.js 6

      - name: Dev build settings (non-main branches)
        if: github.ref != 'refs/heads/main'
        run: |
          sed -i 's|"appId": *"[^"]*"|"appId": "com.devabu.cannonmerge.dev"|; s|"appName": *"[^"]*"|"appName": "Cannon Merge Dev"|' capacitor.config.json
          cat capacitor.config.json

      - name: Generate Android project
        run: npx cap add android

      - name: Lock portrait orientation + allow vibration
        run: |
          sed -i 's|\(android:name="[^"]*MainActivity"\)|\1 android:screenOrientation="portrait"|' android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.VIBRATE" />\n    <application|' android/app/src/main/AndroidManifest.xml
          cat android/app/src/main/AndroidManifest.xml

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -I ../android-signing.gradle

      - name: Prepare APK and verify signing key
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk cannon-merge.apk
          want=$(keytool -list -keystore keystore/debug.keystore -storepass android | grep -i 'fingerprint' | awk '{print $NF}')
          got=$(keytool -printcert -jarfile cannon-merge.apk | grep 'SHA256:' | head -1 | awk '{print $NF}')
          echo "keystore: $want"; echo "apk:      $got"
          test "$want" = "$got"

      - uses: actions/upload-artifact@v4
        with:
          name: cannon-merge-apk
          path: cannon-merge.apk

      - name: Publish Dev Release (non-main branches)
        if: github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp cannon-merge.apk cannon-merge-dev.apk
          gh release create "dev-${{ github.run_number }}" cannon-merge-dev.apk \
            --target "${{ github.sha }}" --prerelease \
            --title "Cannon Merge DEV #${{ github.run_number }} (${{ github.ref_name }})" \
            --notes "Experimental build (branch ${{ github.ref_name }}). Installs next to the main app."

      - name: Publish Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" cannon-merge.apk \
            --title "Cannon Merge #${{ github.run_number }}" \
            --notes "Download cannon-merge.apk and install it on an Android phone." \
            --latest
